<div class="ccomunicacion" x-data="ccomunicacion()" x-init="automatico()">
    <ul class="nav nav-pills">
        <li class="nav-item me-1" onclick="routeTab('estrategiaComunicacion_estrategiaReunion')">
            <a class="nav-link"><i class="bi bi-calendar-check me-2"></i> Estrategia de Reuniones</a>
        </li>
        <li class="nav-item me-1" onclick="routeTab('estrategiaComunicacion_canalComunicacion')">
            <a class="nav-link active"><i class="bi bi-megaphone me-2"></i> Canales de Comunicación</a>
        </li>
    </ul>

    <div class="bg-grey p-3">
        <div class="card card-bep card-agregar mb-3">
            <div class="card-header d-flex align-items-center bg-white py-2 pointer" x-on:click="showNew = !showNew">
                <span class="flex-grow-1 fw-semibold fs-13" :class="{'text-orange': showNew}">
                    <span x-show="campos.CanBepId == 0"><i class="bi bi-plus-square me-2"></i> Agregar canales de comunicación</span>
                    <span x-show="campos.CanBepId > 0"><i class="bi bi-pencil me-2"></i> Editar canales de comunicación</span>
                </span>
                <span x-show="!showNew"><i class="bi bi-chevron-down"></i></span>
                <span x-show="showNew"><i class="bi bi-chevron-up"></i></span>
            </div>
            <div class="card-body" x-show="showNew">
                <form @submit.prevent="guardarCComunicacion()" @keydown.enter.prevent>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-journal-check"></i> Medios utilizados <span class="text-danger">*</span></label>
                        <div class="col-sm-10">
                            <select class="form-select" name="CanBepNombre" x-model="campos.CanBepNombre" required>
                                <option value="">Seleccionar</option>
                                <template x-for="(item, index) in medios" :key="index">
                                    <option :value="item" x-text="item"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-chat-square-dots"></i> Propósito del canal</label>
                        <div class="col-sm-10">
                            <textarea class="form-control" name="CanBepProposito" x-model="campos.CanBepProposito" placeholder="Escribe el proósito del canal aquí..." maxlength="255" rows="2"></textarea>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-orange btn-sm"><i class="bi bi-save"></i> Guardar</button>
                        <button type="button" class="btn btn-secondary btn-sm" x-on:click="cancelarCComunicacion()"><i class="bi bi-arrow-up-left-square"></i> Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card p-3 border-0 rounded-0">
            <template x-if="data.length > 0">
                <table class="table mb-0">
                    <thead class="bg-bep text-white">
                        <tr>
                            <td>Medios utilizados</td>
                            <td>Propósito de canal</td>
                        </tr>
                    </thead>
                    <tbody class="bg-light">
                        <template x-for="(item, index) in data" :key="index">
                            <tr>
                                <td x-text="item.nombre"></td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center actions-show">
                                        <span x-text="item.proposito"></span>
                                        <div class="action d-flex ms-2">
                                            <button type="button" class="btn btn-orange btn-xs me-1" x-on:click="editarCComunicacion(item)" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <button type="button" class="btn btn-secondary btn-xs me-1" x-on:click="eliminarCComunicacion(item)" title="Eliminar">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
        
            <template x-if="data.length == 0">
                <div class="alert alert-secondary">
                    <strong><i class="bi bi-exclamation-circle"></i> Aún no se han registrado canales de comunicación para este proyecto</strong>
                </div>
            </template>
        </div>
    </div>
</div>

<script src="./pages/bep-estrategia-comunicacion-canal/bep-estrategia-comunicacion-canal.js"></script>
