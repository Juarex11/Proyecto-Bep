
<div class="ereunion" x-data="ereunion()" x-init="automatico()">
    <ul class="nav nav-pills">
        <li class="nav-item me-1" onclick="routeTab('estrategiaComunicacion_estrategiaReunion')">
            <a class="nav-link active"><i class="bi bi-calendar-check me-2"></i> Estrategia de Reuniones</a>
        </li>
        <li class="nav-item me-1" onclick="routeTab('estrategiaComunicacion_canalComunicacion')">
            <a class="nav-link"><i class="bi bi-megaphone me-2"></i> Canales de Comunicación</a>
        </li>
    </ul>

    <div class="bg-grey p-3">
        <div class="card card-bep card-agregar mb-3">
            <div class="card-header d-flex align-items-center bg-white py-2 pointer" x-on:click="showNew = !showNew">
                <span class="flex-grow-1 fw-semibold fs-13" :class="{'text-orange': showNew}">
                    <span x-show="campos.ReuBepId == 0"><i class="bi bi-plus-square me-2"></i> Agregar Estrategia de Reunión</span>
                    <span x-show="campos.ReuBepId > 0"><i class="bi bi-pencil me-2"></i> Editar Estrategia de Reunión</span>
                </span>
                <span x-show="!showNew"><i class="bi bi-chevron-down"></i></span>
                <span x-show="showNew"><i class="bi bi-chevron-up"></i></span>
            </div>
            <div class="card-body" x-show="showNew">
                <form @submit.prevent="guardarEReunion()" @keydown.enter.prevent>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-journal-check"></i> Nombre Reunión <span class="text-danger">*</span></label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" placeholder="Ingrese el nombre de la reunión" name="ReuBepNombre" x-model="campos.ReuBepNombre" autocomplete="off" maxlength="255" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-building"></i> Plataforma Reunión <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <select class="form-select" name="ReuBepPlataforma" x-model="campos.ReuBepPlataforma" required>
                                <option value="">Seleccionar</option>
                                <template x-for="(item, index) in plataformas" :key="index">
                                    <option :value="item" x-text="item"></option>
                                </template>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label"><i class="bi bi-calendar-event"></i> Frecuencia Reunión <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <select class="form-select" name="ReuBepFrecuencia" x-model="campos.ReuBepFrecuencia" required>
                                <option value="">Seleccionar</option>
                                <template x-for="(item, index) in frecuencias" :key="index">
                                    <option :value="item" x-text="item"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-calendar-day"></i> Días <span class="text-danger">*</span></label>
                        <div class="col-sm-10">
                            <template x-for="(item, index) in dias" :key="index">
                                <label class="form-check-label me-3 fs-13">
                                    <input type="checkbox" class="form-check-input" :id="'dia_'+item">
                                    <span x-text="item"></span>
                                </label>
                            </template>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-clock"></i> Hora y Minutos <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <input type="time" class="form-control" id="horaMinuto" required>
                        </div>
                        <label class="col-sm-2 col-form-label"><i class="bi bi-hourglass"></i> Duración <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <select class="form-select" name="ReuBepDuracion" x-model="campos.ReuBepDuracion" required>
                                <option value="">Seleccionar</option>
                                <template x-for="(item, index) in duraciones" :key="index">
                                    <option :value="item.minuto" x-text="item.descripcion"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-cloud"></i> Ubicación </label>
                        <div class="col-sm-4">
                            <input type="text" class="form-control" placeholder="Ingrese la ubicación de la reunión" name="ReuBepUbicacion" x-model="campos.ReuBepUbicacion" autocomplete="off" maxlength="100">
                        </div>
                        <label class="col-sm-2 col-form-label"><i class="bi bi-person-check"></i> Responsable </label>
                        <div class="col-sm-4">
                            <input type="text" class="form-control" placeholder="Ingrese el responsable de la reunión" name="ReuBepResponsable" x-model="campos.ReuBepResponsable" autocomplete="off" maxlength="100">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-clipboard2-check"></i> Involucrados</label>
                        <div class="col-sm-10">
                            <select class="form-select" name="involucrados" id="involucrados" multiple style="width: 100%;">
                                <option value="">Seleccionar</option>
                                <template x-for="(item, index) in organizaciones" :key="index">
                                    <option :value="item.id" x-text="item.nombre"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-journal-text"></i> Descripción</label>
                        <div class="col-sm-10">
                            <textarea class="form-control" name="ReuBepDescripcion" x-model="campos.ReuBepDescripcion" placeholder="Escribe la descripción aquí..." maxlength="255" rows="2"></textarea>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-orange btn-sm"><i class="bi bi-save"></i> Guardar</button>
                        <button type="button" class="btn btn-secondary btn-sm" x-on:click="cancelarEReunion()"><i class="bi bi-arrow-up-left-square"></i> Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card p-3 border-0 rounded-0">
            <template x-if="data.length > 0">
                <table class="table mb-0">
                    <thead class="bg-bep text-white">
                        <tr>
                            <td>Reunión</td>
                            <td>Plataforma</td>
                            <td>Frecuencia</td>
                            <td>Días</td>
                            <td>Hora</td>
                            <td>Duración</td>
                            <td>Ubicación</td>
                            <td>Responsable</td>
                            <td>Involucrados</td>
                            <td>Descripción</td>
                        </tr>
                    </thead>
                    <tbody class="bg-light">
                        <template x-for="(item, index) in data" :key="index">
                            <tr>
                                <td x-text="item.nombre"></td>
                                <td x-text="item.plataforma"></td>
                                <td x-text="item.frecuencia"></td>
                                <td x-text="item.dias.slice(0, -1)"></td>
                                <td x-text="item.hora+':'+item.minuto"></td>
                                <td x-text="item.duracion+' min'"></td>
                                <td x-text="item.ubicacion"></td>
                                <td x-text="item.responsable"></td>
                                <td x-text="getInvolucrados(item.involucrados)"></td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center actions-show">
                                        <span x-text="item.descripcion"></span>
                                        <div class="action d-flex ms-2">
                                            <button type="button" class="btn btn-orange btn-xs me-1" x-on:click="editarEReunion(item)" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <button type="button" class="btn btn-secondary btn-xs me-1" x-on:click="eliminarEReunion(item)" title="Eliminar">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>   
            </template> 

            <template x-if="data.length == 0">
                <div class="alert alert-secondary">
                    <strong><i class="bi bi-exclamation-circle"></i> Aún no se han registrado estrategias de reunión para este proyecto</strong>
                </div>
            </template>
        </div>
    </div>
</div>

<script src="./pages/bep-estrategia-comunicacion-reunion/bep-estrategia-comunicacion-reunion.js"></script>
