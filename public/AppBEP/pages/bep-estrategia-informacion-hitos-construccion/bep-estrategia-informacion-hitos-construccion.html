<div class="hconstruccion" x-data="hconstruccion()" x-init="automatico()">
    <ul class="nav nav-pills">
        <li class="nav-item me-1" onclick="routeTab('estrategiaInformacion_hitosConstruccion')">
            <a class="nav-link active"><i class="bi bi-building me-2"></i> Hitos de construcción</a>
        </li>
        <li class="nav-item me-1" onclick="routeTab('estrategiaInformacion_hitosEntrega')">
            <a class="nav-link"><i class="bi bi-send-check me-2"></i> Hitos de entrega de información</a>
        </li>
        <li class="nav-item me-1" onclick="routeTab('estrategiaInformacion_flujoTrabajo')">
            <a class="nav-link"><i class="bi bi-arrow-repeat"></i> Flujo de trabajo</a>
        </li>
        <li class="nav-item me-1" onclick="routeTab('estrategiaInformacion_entornoComunDatos')">
            <a class="nav-link"><i class="bi bi-cloud-arrow-up"></i> Entorno Común de Datos (CDE)</a>
        </li>
    </ul>

    <div class="bg-grey p-3">
        <div class="card card-bep card-agregar mb-3">
            <div class="card-header d-flex align-items-center bg-white py-2 pointer" x-on:click="showNew = !showNew">
                <span class="flex-grow-1 fw-semibold fs-13" :class="{'text-orange': showNew}"><i class="bi bi-plus-square me-2"></i> Agregar hitos de construcción</span>
                <span x-show="!showNew"><i class="bi bi-chevron-down"></i></span>
                <span x-show="showNew"><i class="bi bi-chevron-up"></i></span>
            </div>
            <div class="card-body" x-show="showNew">
                <form @submit.prevent="guardarHConstruccion()" @keydown.enter.prevent>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-journal-check"></i> Nombre Hito <span class="text-danger">*</span></label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" placeholder="Ingrese el nombre del hito" name="HitConNombre" x-model="campos.HitConNombre" autocomplete="off" maxlength="255" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-calendar"></i> Fecha inicio <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <input type="date" class="form-control" name="HitConFechaInicio" x-model="campos.HitConFechaInicio" autocomplete="off" required>
                        </div>
                        <label class="col-sm-2 col-form-label"><i class="bi bi-calendar-check"></i> Fecha fin <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <input type="date" class="form-control" name="HitConFechaFin" x-model="campos.HitConFechaFin" autocomplete="off" required>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-orange btn-sm"><i class="bi bi-save"></i> Guardar</button>
                        <button type="button" class="btn btn-secondary btn-sm" x-on:click="cancelarHConstruccion()"><i class="bi bi-arrow-up-left-square"></i> Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card p-3 border-0 rounded-0">
            <template x-if="data.length > 0">
                <table class="table mb-0">
                    <thead class="bg-bep text-white">
                        <tr>
                            <td>Hito Construcción</td>
                            <td>Fecha inicio</td>
                            <td>Fecha fin</td>
                        </tr>
                    </thead>
                    <tbody class="bg-light">
                        <template x-for="(item, index) in data" :key="index">
                            <tr>
                                <td>
                                    <span x-text="item.nombre" x-show="!item.editar"></span>
                                    <input class="form-control form-control-sm" x-show="item.editar" x-model="item.nombre" placeholder="Ingrese el nombre del hito de construcción">
                                </td>
                                <td>
                                    <span x-text="obtenerFechaAmericana(item.fechaInicio)" x-show="!item.editar"></span>
                                    <input type="date" class="form-control form-control-sm" x-show="item.editar" x-model="item.fechaInicio">
                                </td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center actions-show">
                                        <span x-text="obtenerFechaAmericana(item.fechaFin)" x-show="!item.editar"></span>
                                        <input type="date" class="form-control form-control-sm" x-show="item.editar" x-model="item.fechaFin">
                                        
                                        <template x-if="!item.editar">
                                            <div class="action d-flex ms-2">
                                                <button type="button" class="btn btn-orange btn-xs me-1" x-on:click="itemEditar(item)" title="Editar">
                                                    <i class="bi bi-pencil"></i>
                                                </button>
                                                <button type="button" class="btn btn-secondary btn-xs me-1" x-on:click="actualizarHConstruccion(item, false)" title="Eliminar">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </div>
                                        </template>
                                        <template x-if="item.editar">
                                            <div class="d-flex ms-2">
                                                <button type="button" class="btn btn-orange btn-xs me-1" x-on:click="actualizarHConstruccion(item)" title="Guardar">
                                                    <i class="bi bi-save"></i>
                                                </button>
                                                <button type="button" class="btn btn-secondary btn-xs me-1" x-on:click="cancelarEditar(item, false)" title="Cancelar">
                                                    <i class="bi bi-x-circle"></i>
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            
            <template x-if="data.length == 0">
                <div class="alert alert-secondary">
                    <strong><i class="bi bi-exclamation-circle"></i> Aún no se han registrado hitos de construcción para este proyecto</strong>
                </div>
            </template>
        </div>
    </div>
</div>

<script src="./pages/bep-estrategia-informacion-hitos-construccion/bep-estrategia-informacion-hitos-construccion.js"></script>
