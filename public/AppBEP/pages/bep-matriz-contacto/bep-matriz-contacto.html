<div class="contacto" x-data="contacto()" x-init="automatico()">
    <ul class="nav nav-pills">
        <li class="nav-item me-1" onclick="routeTab('matriz_contacto')">
            <a class="nav-link active"><i class="bi bi-people me-2"></i> Contactos Clave</a>
        </li>
        <li class="nav-item me-1" onclick="routeTab('matriz_raci')">
            <a class="nav-link"><i class="bi bi-grid"></i> Matriz RACI</a>
        </li>
    </ul>

    <div class="bg-grey p-3">
        <div class="card card-bep card-agregar mb-3">
            <div class="card-header d-flex align-items-center bg-white py-2 pointer" x-on:click="showNew = !showNew">
                <span class="flex-grow-1 fw-semibold fs-13" :class="{'text-orange': showNew}"><i class="bi bi-plus-square me-2"></i> Agregar Contacto</span>
                <span x-show="!showNew"><i class="bi bi-chevron-down"></i></span>
                <span x-show="showNew"><i class="bi bi-chevron-up"></i></span>
            </div>
            <div class="card-body" x-show="showNew">
                <form @submit.prevent="guardarContactoBep()" @keydown.enter.prevent>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label">
                            <i class="bi bi-envelope"></i> Correo <span class="text-danger">*</span>
                        </label>
                        <div class="col-sm-10">
                            <select class="form-select" name="correo" x-model="campos.correo" id="correo" :required="campos.correo == ''" style="width: 100%;">
                                <option value="">Elija una opción</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-person"></i> Nombres <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <input type="text" class="form-control" placeholder="Ingrese los nombres" name="nombres" x-model="campos.nombres" autocomplete="off" maxlength="100" required>
                        </div>
                        <label class="col-sm-2 col-form-label"><i class="bi bi-person-badge"></i> Apellidos <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <input type="text" class="form-control" placeholder="Ingrese los apellidos" name="apellidos" x-model="campos.apellidos" autocomplete="off" maxlength="100" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-building"></i> Organización <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <select class="form-select" name="OrgBepId" x-model="campos.OrgBepId" id="OrgBepId" :required="campos.OrgBepId == ''">
                                <option value="">Seleccionar</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label"><i class="bi bi-briefcase"></i> Rol <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <select class="form-select" name="RolBepId" x-model="campos.RolBepId" required>
                                <option value="">Seleccionar</option>
                                <template x-for="(item, index) in roles" :key="index">
                                    <option :value="item.id" x-text="item.descripcion"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-telephone"></i> Teléfono </label>
                        <div class="col-sm-4">
                            <input type="text" class="form-control" placeholder="Ingrese el teléfono" name="telefono" x-model="campos.telefono" autocomplete="off" maxlength="20">
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-orange btn-sm"><i class="bi bi-save"></i> Guardar</button>
                        <button type="button" class="btn btn-secondary btn-sm" x-on:click="cancelarContacto()"><i class="bi bi-arrow-up-left-square"></i> Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card p-3 border-0 rounded-0">
            <template x-if="data.length > 0">
                <table class="table mb-0">
                    <thead class="bg-bep text-white">
                        <tr>
                            <td>Nombre</td>
                            <td>Apellidos</td>
                            <td>Correo Electrónico</td>
                            <td>Organización</td>
                            <td>Rol</td>
                            <td>Teléfono</td>
                            <td>Permisos</td>
                        </tr>
                    </thead>
                    <tbody class="bg-light">
                        <template x-for="(item, index) in data" :key="index">
                            <tr>
                                <td>
                                    <span x-text="item.nombres" x-show="!item.editar"></span>
                                    <input type="text" class="form-control form-control-sm" x-show="item.editar" placeholder="Ingrese los nombres" x-model="item.nombres" autocomplete="off" maxlength="100">
                                </td>
                                <td>
                                    <span x-text="item.apellidos" x-show="!item.editar"></span>
                                    <input type="text" class="form-control form-control-sm" x-show="item.editar" placeholder="Ingrese los apellidos" x-model="item.apellidos" autocomplete="off" maxlength="100">
                                </td>
                                <td x-text="item.correo"></td>
                                <td>
                                    <span x-text="item.orgNombre" x-show="!item.editar"></span>
                                    <select class="form-select form-select-sm" x-show="item.editar" x-model="item.orgId" :id="'OrgBepId_'+item.id" style="width: 200px;">
                                        <option :value="item.orgId" x-text="item.orgNombre"></option>
                                    </select>
                                    <input type="hidden" x-model="item.orgId" :id="'orgId_'+item.id">
                                    <input type="hidden" x-model="item.orgNombre" :id="'orgNombre_'+item.id">
                                </td>
                                <td>
                                    <span x-text="item.rolNombre" x-show="!item.editar"></span>
                                    <select class="form-select form-select-sm" x-show="item.editar" x-model="item.rolId">
                                        <template x-for="(item, index) in roles" :key="index">
                                            <option :value="item.id" x-text="item.descripcion"></option>
                                        </template>
                                    </select>
                                </td>
                                <td>
                                    <span x-text="item.telefono" x-show="!item.editar"></span>
                                    <input type="text" class="form-control form-control-sm" x-show="item.editar" placeholder="Ingrese el teléfono" x-model="item.telefono" autocomplete="off" maxlength="20">
                                </td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center actions-show">
                                        <span x-text="({0: 'Ninguno', 1: 'Ver', 2: 'Editar'})[item.permiso]" x-show="!item.editar"></span>
                                        <select class="form-select form-select-sm" x-show="item.editar" x-model="item.permiso">
                                            <option value="0">Ninguno</option>
                                            <option value="1">Ver</option>
                                            <option value="2">Editar</option>
                                        </select>
                                        
                                        <template x-if="!item.editar">
                                            <div class="action d-flex ms-2">
                                                <button type="button" class="btn btn-orange btn-xs me-1" x-on:click="itemEditar(item)" title="Editar">
                                                    <i class="bi bi-pencil"></i>
                                                </button>
                                                <button type="button" class="btn btn-secondary btn-xs me-1" x-on:click="eliminarContacto(item)" title="Eliminar">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </div>
                                        </template>
                                        <template x-if="item.editar">
                                            <div class="d-flex ms-2">
                                                <button type="button" class="btn btn-orange btn-xs me-1" x-on:click="actualizarContacto(item)" title="Guardar">
                                                    <i class="bi bi-save"></i>
                                                </button>
                                                <button type="button" class="btn btn-secondary btn-xs me-1" x-on:click="cancelarEditar(item, false)" title="Cancelar">
                                                    <i class="bi bi-x-circle"></i>
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template x-if="data.length == 0">
                <div class="alert alert-secondary">
                    <strong><i class="bi bi-exclamation-circle"></i> Aún no se han registrado contactos clave para este proyecto</strong>
                </div>
            </template>
        </div>
    </div>
</div>

<script src="./pages/bep-matriz-contacto/bep-matriz-contacto.js"></script>
