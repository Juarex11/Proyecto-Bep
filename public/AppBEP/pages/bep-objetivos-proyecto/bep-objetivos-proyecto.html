<div class="proyecto" x-data="proyecto()" x-init="automatico()">
    <ul class="nav nav-pills">
        <li class="nav-item me-1" onclick="routeTab('objetivos_cliente')">
            <a class="nav-link"><i class="bi bi bi-buildings me-2"></i> Objetivos del Cliente</a>
        </li>
        <li class="nav-item me-1" onclick="routeTab('objetivos_proyecto')">
            <a class="nav-link active"><i class="bi bi-bullseye me-2"></i> Objetivos del Proyecto</a>
        </li>
        <li class="nav-item me-1" onclick="routeTab('objetivos_bim')">
            <a class="nav-link"><i class="bi bi-building-fill-up"></i> Objetivos BIM</a>
        </li>
        <li class="nav-item me-1" onclick="routeTab('objetivos_usosBim')">
            <a class="nav-link"><i class="bi bi-building-fill-gear"></i> Usos BIM</a>
        </li>
    </ul>
    <div class="bg-grey p-3">
        <div class="card card-bep card-agregar mb-3">
            <div class="card-header d-flex align-items-center bg-white py-2 pointer" x-on:click="showNew = !showNew">
                <span class="flex-grow-1 fw-semibold fs-13" :class="{'text-orange': showNew}"><i class="bi bi-plus-square me-2"></i> Agregar objetivo</span>
                <span x-show="!showNew"><i class="bi bi-chevron-down"></i></span>
                <span x-show="showNew"><i class="bi bi-chevron-up"></i></span>
            </div>
            <div class="card-body" x-show="showNew">
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label"><i class="bi bi-journal-check"></i> Objetivo <span class="text-danger">*</span></label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" placeholder="Ingrese el nombre del objetivo" name="ObjBepNombre" x-model="campos.ObjBepNombre" autocomplete="off" maxlength="255">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label"><i class="bi bi-journal-text"></i> Descripción</label>
                    <div class="col-sm-10">
                        <textarea class="form-control" name="ObjBepDescripcion" x-model="campos.ObjBepDescripcion" placeholder="Escribe tu descripción aquí..." maxlength="500" rows="2"></textarea>
                    </div>
                </div>
                <div>
                    <button type="button" class="btn btn-orange btn-sm" x-on:click="guardarObjProyecto()"><i class="bi bi-save"></i> Guardar</button>
                    <button type="button" class="btn btn-secondary btn-sm" x-on:click="cancelarObjProyecto()"><i class="bi bi-arrow-up-left-square"></i> Cancelar</button>
                </div>
            </div>
        </div>
    
        <div class="card p-3 border-0 rounded-0">
            <template x-if="data.length > 0">
                <table class="table mb-0" >
                    <thead class="bg-bep text-white">
                        <tr>
                            <td>Objetivo</td>
                            <td>Descripción</td>
                        </tr>
                    </thead>
                    <tbody class="bg-light">
                        <template x-for="(item, index) in data" :key="index">
                            <tr>
                                <td>
                                    <!--<span class="badge rounded-pill text-bg-orange me-2" x-show="!item.editar" x-text="index + 1"></span>-->
                                    <span x-text="item.nombre" x-show="!item.editar"></span>
                                    <textarea class="form-control form-control-sm" x-show="item.editar" x-model="item.nombre" :id="'nombreOP_'+item.id" placeholder="Ingrese el nombre del objetivo"></textarea>
                                </td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center actions-show">
                                        <span x-text="item.descripcion" x-show="!item.editar"></span>
                                        <textarea class="form-control form-control-sm" x-show="item.editar" x-model="item.descripcion" :id="'descripcionOP_'+item.id" placeholder="Escribe tu descripción aquí..."></textarea>
                                        
                                        <template x-if="!item.editar">
                                            <div class="action d-flex ms-2">
                                                <button type="button" class="btn btn-orange btn-xs me-1" x-on:click="itemEditar(item)" title="Editar">
                                                    <i class="bi bi-pencil"></i>
                                                </button>
                                                <button type="button" class="btn btn-secondary btn-xs me-1" x-on:click="actualizarObjProyecto(item, false)" title="Eliminar">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </div>
                                        </template>
                                        <template x-if="item.editar">
                                            <div class="d-flex ms-2">
                                                <button type="button" class="btn btn-orange btn-xs me-1" x-on:click="actualizarObjProyecto(item)" title="Guardar">
                                                    <i class="bi bi-save"></i>
                                                </button>
                                                <button type="button" class="btn btn-secondary btn-xs me-1" x-on:click="cancelarEditar(item, false)" title="Cancelar">
                                                    <i class="bi bi-x-circle"></i>
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            
            <template x-if="data.length == 0">
                <div class="alert alert-secondary">
                    <strong><i class="bi bi-exclamation-circle"></i> Aún no se han registrado objetivos para este proyecto</strong>
                </div>
            </template>
        </div>
    </div>
</div>

<script src="./pages/bep-objetivos-proyecto/bep-objetivos-proyecto.js"></script>
