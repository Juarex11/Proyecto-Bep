<div class="mi-empresa" x-data="miEmpresa()" x-init="automatico()">
    <ul class="nav nav-pills">
        <li class="nav-item me-1" x-show="esSuperadmin" onclick="routeTabConfig('administracion_empresas')">
            <a class="nav-link"><i class="bi bi-buildings me-2"></i> Empresas</a>
        </li>
        <li class="nav-item me-1" onclick="routeTabConfig('administracion_empresa')">
            <a class="nav-link active"><i class="bi bi-building me-2"></i> Mi empresa</a>
        </li>
        <li class="nav-item me-1" onclick="routeTabConfig('administracion_usuarios')">
            <a class="nav-link"><i class="bi bi-people me-2"></i> Usuarios</a>
        </li>
    </ul>

    <div class="bg-grey p-3">
        <div class="card card-bep mb-3">
            <div class="card-header bg-white fw-semibold fs-13"><i class="bi bi-building me-2"></i> Datos de la empresa</div>
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-3 col-12 mb-3 mb-md-0">
                        <div class="logo-caja border rounded d-flex align-items-center justify-content-center bg-white" style="height:150px">
                            <img :src="logoUrl" alt="Logo de la empresa" x-show="tieneLogo" style="max-width:90%;max-height:130px" x-on:error="tieneLogo = false">
                            <span class="text-muted text-center fs-12" x-show="!tieneLogo"><i class="bi bi-image d-block fs-2"></i> Sin logo</span>
                        </div>
                    </div>
                    <div class="col-md-9 col-12">
                        <p class="mb-1 fs-12 text-muted">Empresa</p>
                        <p class="fw-bold text-bep fs-5 mb-3" x-text="nombre"></p>
                        <p class="mb-2 fs-12 text-muted">Logo de la empresa: se muestra en el menú superior. Use una imagen PNG, JPG o WEBP; se ajusta de tamaño automáticamente.</p>
                        <div class="d-flex flex-wrap gap-2">
                            <label class="btn btn-orange btn-sm mb-0" for="archivoLogo"><i class="bi bi-upload"></i> Subir logo</label>
                            <input type="file" id="archivoLogo" accept="image/png,image/jpeg,image/webp" hidden x-on:change="subir($event)">
                            <button type="button" class="btn btn-outline-orange btn-sm" x-show="tieneLogo" x-on:click="quitar()"><i class="bi bi-trash"></i> Quitar logo</button>
                        </div>
                        <p class="mt-3 mb-0 fs-12 text-muted" x-show="rolEmpresa != 'admin'">Solo el administrador de la empresa puede cambiar el logo.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="./pages/cfg-administracion-mi-empresa/cfg-administracion-mi-empresa.js"></script>
