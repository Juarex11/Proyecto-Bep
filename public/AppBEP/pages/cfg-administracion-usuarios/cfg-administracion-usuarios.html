<div class="usuarios" x-data="usuarios()" x-init="automatico()">
    <ul class="nav nav-pills">
        <li class="nav-item me-1" x-show="esSuperadmin" onclick="routeTabConfig('administracion_empresas')">
            <a class="nav-link"><i class="bi bi-buildings me-2"></i> Empresas</a>
        </li>
        <li class="nav-item me-1" onclick="routeTabConfig('administracion_empresa')">
            <a class="nav-link"><i class="bi bi-building me-2"></i> Mi empresa</a>
        </li>
        <li class="nav-item me-1" onclick="routeTabConfig('administracion_usuarios')">
            <a class="nav-link active"><i class="bi bi-people me-2"></i> Usuarios</a>
        </li>
    </ul>
    <div class="bg-grey p-3">
        <div class="card card-bep card-agregar mb-3">
            <div class="card-header d-flex align-items-center bg-white pointer" x-on:click="showNew = !showNew">
                <span class="flex-grow-1 fw-semibold fs-13" :class="{'text-orange': showNew}">
                    <span x-show="campos.usuarioId == ''"><i class="bi bi-plus-square me-2"></i> Agregar Usuario</span>
                    <span x-show="campos.usuarioId != ''"><i class="bi bi-pencil me-2"></i> Editar Usuario</span>
                </span>
                <span x-show="!showNew"><i class="bi bi-chevron-down"></i></span>
                <span x-show="showNew"><i class="bi bi-chevron-up"></i></span>
            </div>
            <div x-bscollapse="showNew">
                <div class="card-body">
                    <form @submit.prevent="guardarUsuario()" @keydown.enter.prevent>
                    <div class="mb-3 row">
                        <label class="col-form-label"><i class="bi bi-journal-check"></i> DNI <span class="text-danger">*</span></label>
                        <div><input type="text" class="form-control" placeholder="Ingrese DNI" name="dni" x-model="campos.dni" autocomplete="off" minlength="8" maxlength="8" required></div>
                        <label class="col-form-label"><i class="bi bi-telephone"></i> Teléfono</label>
                        <div><input type="text" class="form-control" placeholder="Ingrese Telefono" name="telefono" x-model="campos.telefono" autocomplete="off" minlength="6" maxlength="9"></div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-form-label"><i class="bi bi-person"></i> Nombre <span class="text-danger">*</span></label>
                        <div><input type="text" class="form-control" placeholder="Ingrese Nombre" name="nombre" x-model="campos.nombre" autocomplete="off" maxlength="100" required></div>
                        <label class="col-form-label">Apellidos <span class="text-danger">*</span></label>
                        <div><input type="text" class="form-control" placeholder="Ingrese Apellidos" name="apellido" x-model="campos.apellido" autocomplete="off" maxlength="100" required></div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-form-label"><i class="bi bi-envelope"></i> Correo electrónico <span class="text-danger">*</span></label>
                        <div><input type="email" class="form-control" placeholder="Ingrese Correo Eletrónico" name="correoU" x-model="campos.correo" autocomplete="off" maxlength="100" required></div>
                        <label class="col-form-label"><i class="bi bi-key"></i> Contraseña <span class="text-danger">*</span></label>
                        <div><input type="password" class="form-control" placeholder="Ingrese Contraseña" name="passwordU" x-model="campos.password" autocomplete="new-password" minlength="8" maxlength="100" :required="campos.usuarioId == ''" :placeholder="campos.usuarioId == '' ? 'Mínimo 8 caracteres' : 'Dejar vacío para no cambiarla'"></div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-form-label"><i class="bi bi-geo-alt"></i> Dirección</label>
                        <div><input type="text" class="form-control" placeholder="Ingrese Dirección" name="direccion" x-model="campos.direccion" autocomplete="off" maxlength="150"></div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-form-label"><i class="bi bi-shield-check"></i> Rol <span class="text-danger">*</span></label>
                        <div><select class="form-select" name="rol" x-model="campos.rol" required>
                                <option value="usuario">Usuario (trabaja con los BEP)</option>
                                <option value="admin">Administrador (configuración y usuarios)</option>
                            </select></div>
                        <label class="col-form-label"><i class="bi bi-calendar-event"></i> Estado <span class="text-danger">*</span></label>
                        <div><select class="form-select" name="estado" x-model="campos.estado" required>
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select></div>
                    </div>
                    <div class="mb-3 row" x-show="campos.usuarioId != ''">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-person-circle"></i> Foto</label>
                        <div class="col-sm-10 d-flex align-items-center flex-wrap gap-2">
                            <span class="av-mini av-grande">
                                <img :src="campos.foto ? fotoUrl(campos.usuarioId, campos.foto) : null" alt="" x-show="campos.foto" x-on:error="campos.foto = 0">
                                <span x-show="!campos.foto" x-text="iniciales(campos.nombre + ' ' + campos.apellido)"></span>
                            </span>
                            <label class="btn btn-outline-orange btn-sm mb-0" for="fotoUsuario"><i class="bi bi-upload"></i> Cambiar foto</label>
                            <input type="file" id="fotoUsuario" accept="image/png,image/jpeg,image/webp" hidden x-on:change="subirFoto($event)">
                            <button type="button" class="btn btn-outline-secondary btn-sm" x-show="campos.foto" x-on:click="quitarFoto()"><i class="bi bi-trash"></i> Quitar</button>
                            <span class="fs-12 text-muted">La foto se guarda al instante (no necesita "Guardar"). Aparece en el menú superior de ese usuario.</span>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-orange btn-sm"><i class="bi bi-save"></i> Guardar</button>
                        <button type="button" class="btn btn-secondary btn-sm" x-on:click="cancelarUsuario()"><i class="bi bi-arrow-up-left-square"></i> Cancelar</button>
                    </div>
                </form>
                </div>
            </div>
        </div>
        <div class="card border-0">
            <div class="card-body">
                <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                    <span class="fw-semibold fs-13 text-orange me-auto"><i class="bi bi-people me-2"></i> Lista de Usuario</span>
                    <div class="input-group input-group-sm w-auto">
                        <span class="input-group-text">Estado</span>
                        <select class="form-select" x-model="pag.estado" x-on:change="listaUsuarios()">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div x-tabla="{
                    rows: data,
                    orden: [[2, 'asc']],
                    cols: cols(),
                    acciones: { editar: (item) => editarUsuario(item), eliminar: (item) => eliminarUsuario(item) }
                }"></div>
            </div>
        </div>
    </div>
</div>

<script src="./pages/cfg-administracion-usuarios/cfg-administracion-usuarios.js"></script>
