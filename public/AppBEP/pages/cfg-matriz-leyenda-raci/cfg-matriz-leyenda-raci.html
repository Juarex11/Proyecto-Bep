<div class="leyRaci" x-data="leyRaci()" x-init="automatico()">
    <ul class="nav nav-pills">
        <li class="nav-item me-1" onclick="routeTabConfig('matriz_organizaciones')">
            <a class="nav-link"><i class="bi bi-buildings me-2"></i> Organizaciones</a>
        </li>
        <li class="nav-item me-1" onclick="routeTabConfig('matriz_roles')">
            <a class="nav-link"><i class="bi bi-person-badge"></i> Roles</a>
        </li>
        <li class="nav-item me-1" onclick="routeTabConfig('matriz_actividades')">
            <a class="nav-link"><i class="bi bi-list-check"></i> Actividades</a>
        </li>
        <li class="nav-item me-1" onclick="routeTabConfig('matriz_procesos')">
            <a class="nav-link"><i class="bi bi-repeat"></i> Procesos</a>
        </li>
        <li class="nav-item me-1" onclick="routeTabConfig('matriz_leyRaci')">
            <a class="nav-link active"><i class="bi bi-info-circle"></i> Leyenda RACI</a>
        </li>
    </ul>
    <div class="bg-grey p-3">
        <div class="card card-bep card-agregar mb-3">
            <div class="card-header d-flex align-items-center bg-white pointer" x-on:click="showNew = !showNew">
                <span class="flex-grow-1 fw-semibold fs-13" :class="{'text-orange': showNew}">
                    <span x-show="campos.LeyRaciId == 0"><i class="bi bi-plus-square me-2"></i> Agregar Leyenda RACI</span>
                    <span x-show="campos.LeyRaciId > 0"><i class="bi bi-pencil me-2"></i> Editar Leyenda RACI</span>
                </span>
                <span x-show="!showNew"><i class="bi bi-chevron-down"></i></span>
                <span x-show="showNew"><i class="bi bi-chevron-up"></i></span>
            </div>
            <div x-bscollapse="showNew">
                <div class="card-body">
                    <form @submit.prevent="guardarLeyRaci()" @keydown.enter.prevent>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-journal-check"></i> Nombre Leyenda RACI <span class="text-danger">*</span></label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" placeholder="Ingrese el nombre de Leyenda RACI" name="LeyRaciNombre" x-model="campos.LeyRaciNombre" autocomplete="off" maxlength="40" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-calendar-event"></i> Abreviación <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <select class="form-select" name="LeyRaciAbreviacion" x-model="campos.LeyRaciAbreviacion" required>
                                <option value="">Seleccione una opción</option>
                                <option value="R">R</option>
                                <option value="A">A</option>
                                <option value="C">C</option>
                                <option value="I">I</option>
                            </select>
                        </div>
                        <label class="col-sm-2 col-form-label"><i class="bi bi-calendar-event"></i> Color <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                            <input type="color" class="form-control" name="LeyRaciBackground" x-model="campos.LeyRaciBackground" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-2 col-form-label"><i class="bi bi-calendar-event"></i> Estado <span class="text-danger">*</span></label>
                        <div class="col-sm-4">
                                <select class="form-select" name="LeyRaciEstado" x-model="campos.LeyRaciEstado" required>
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-orange btn-sm"><i class="bi bi-save"></i> Guardar</button>
                        <button type="button" class="btn btn-secondary btn-sm" x-on:click="cancelarLeyRaci()"><i class="bi bi-arrow-up-left-square"></i> Cancelar</button>
                    </div>
                </form>
                </div>
            </div>
        </div>
        <div class="card border-0">
            <div class="card-body">
                <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                    <span class="fw-semibold fs-13 text-orange me-auto"><i class="bi bi-list-task me-2"></i> Lista de Leyenda RACI</span>
                    <div class="input-group input-group-sm w-auto"><span class="input-group-text">Estado</span>
                        <select class="form-select" x-model="pag.estado" x-on:change="listaLeyRaci()">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select></div>
                </div>
                <div x-tabla="{
                    rows: data,
                    orden: [[0, 'asc']],
                    cols: [
                        { t: 'Nombre Leyenda Raci', c: 'nombre', cls: 'fw-semibold' },
                        { t: 'Abreviación', c: 'abreviacion' },
                        { t: 'Color', orden: false, render: (item) => '<span class=\'d-inline-block rounded-circle border\' style=\'width:20px;height:20px;background-color:' + bepEsc(item.background) + '\'></span>' },
                        { t: 'Estado', c: 'estado', tipo: 'estado' }
                    ],
                    acciones: { editar: (item) => editarLeyRaci(item), eliminar: (item) => eliminarLeyRaci(item) }
                }"></div>
            </div>
        </div>
    </div>
</div>

<script src="./pages/cfg-matriz-leyenda-raci/cfg-matriz-leyenda-raci.js"></script>
