    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10.5" rx="2.5" fill="currentColor" stroke="none"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
    ojo: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    ojoNo: '<path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.7M6.6 7.6C3.9 9.3 2 12 2 12s3.6 6 10 6c1.4 0 2.7-.3 3.8-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
    entrar: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>',
    salir: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
    flecha: '<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
    usuario: '<circle cx="12" cy="8" r="4" fill="currentColor" stroke="none"/><path d="M4 21a8 8 0 0 1 16 0z" fill="currentColor" stroke="none"/>',
    edificio: '<path d="M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17"/><path d="M14 9h5a1 1 0 0 1 1 1v11"/><path d="M3 21h18"/><path d="M8 7h2M8 11h2M8 15h2"/>',
  };

  function vistaLogin() {
    clear(); document.body.classList.add('en-login');
    const m = h('div', { class: 'msg', role: 'alert' });
    const u = h('input', { type: 'text', name: 'usuario', placeholder: 'Usuario o correo electrónico', autocomplete: 'username', autocapitalize: 'off', spellcheck: 'false', required: true, autofocus: true });
    const p = h('input', { type: 'password', name: 'password', placeholder: 'Contraseña', autocomplete: 'current-password', required: true });
    const rec = h('input', { type: 'checkbox', id: 'lg-rec' });
    const ver = h('button', { class: 'ver', type: 'button', 'aria-label': 'Mostrar contraseña', onclick: () => {
      const oculto = p.type === 'password'; p.type = oculto ? 'text' : 'password';
      ver.replaceChildren(ico(oculto ? ICO.ojo : ICO.ojoNo)); ver.setAttribute('aria-label', oculto ? 'Ocultar contraseña' : 'Mostrar contraseña'); p.focus();
    } }, ico(ICO.ojoNo));
    const b = h('button', { class: 'lg-ok', type: 'submit' }, ico(ICO.entrar), 'Ingresar');
    const olvido = h('button', { class: 'lnk', type: 'button', onclick: () => {
      const d = modal('Recuperar contraseña', h('p', { style: 'margin:0' }, 'Para restablecer su contraseña comuníquese con el administrador de su empresa. Una vez ingrese, podrá cambiarla desde "Cambiar contraseña".'), null);
    } }, '¿Olvidaste tu contraseña?');
    const f = h('form', { class: 'lg-card', onsubmit: async (e) => {
      e.preventDefault(); b.disabled = true; msg(m, '');
      const r = await api('auth/login', 'POST', { correo: u.value.trim(), password: p.value, recordar: rec.checked }).catch(() => null);
      if (r && r.ok) return iniciar();
      msg(m, r ? (r.d.mensaje || 'No se pudo ingresar') : 'Sin conexión con el servidor'); b.disabled = false;
    } },
      h('img', { class: 'lg-logo', src: '_portal/logo.png', alt: 'Lyracode BEPcloud', width: 210, height: 54 }),
      h('h2', {}, 'Iniciar Sesión'), h('p', { class: 'lg-sub' }, 'Accede a tu cuenta para gestionar tu BEP'),
      h('div', { class: 'lg-campo' }, ico(ICO.user, 'class="ico"'), u),
      h('div', { class: 'lg-campo' }, ico(ICO.lock, 'class="ico"'), p, ver),
      h('div', { class: 'lg-fila' }, h('label', { for: 'lg-rec' }, rec, 'Recordar sesión'), olvido),
      b, m, h('div', { class: 'lg-pie-card' }, 'BEPcloud · Lyracode'));
    const hero = h('section', { class: 'lg-hero' }, h('div', {}, h('h1', {}, 'Plan de Ejecución BIM', h('span', {}, 'en la Nube')), h('hr'),
      h('p', {}, 'Gestiona, alinea y controla tu BEP con estándares internacionales como la ', h('b', {}, 'NTP ISO 19650.'))));
    const pie = h('div', { class: 'lg-pie' }, h('span', {}, 'Impulsando la metodología ', h('b', {}, 'VDC'), ' en la industria AEC'));
    app.append(h('div', { class: 'lg' }, hero, h('section', { class: 'lg-side' }, f), pie));
  }

  // ---------------- entrar a una empresa ----------------
  async function entrar(slug, aviso) {
    const r = await api('auth/entrar', 'POST', { slug });
    if (r.ok && r.d.url) { location.href = r.d.url; return true; }
    if (aviso) msg(aviso, r.d.mensaje || 'No se pudo entrar', false);
    return false;
  }

  // ---------------- cerrar sesion ----------------
  async function cerrarSesion() {
    try { await api('auth/logout', 'POST', {}); } catch (e) { /* aun asi se intenta salir */ }
    location.replace(B);   // se recarga el portal ya sin sesion (muestra el login)
  }

  // ---------------- inicio ----------------
  function cabecera() {
    const y = state.yo.usuario;
    const nombre = `${y.nombre} ${y.apellido}`.trim() || y.correo;
    return h('header', { class: 'pt-bar' }, h('img', { src: '_portal/logo.png', alt: 'BEPcloud', width: 160, height: 41 }),
      h('div', { class: 'pt-who' }, avatarUsuario(y, nombre), h('div', {}, nombre, h('small', {}, y.correo)), y.superadmin ? h('span', { class: 'sup' }, 'Superadmin') : null),
      h('div', { class: 'pt-acc' },
        h('button', { class: 'pt-btn borde', onclick: dialogoClave }, ico(ICO.lock, 'style="width:16px;height:16px"'), 'Cambiar contraseña'),
        h('button', { class: 'pt-btn naranja', onclick: cerrarSesion }, ico(ICO.salir), 'Cerrar sesión')));
  }

  const avatarUsuario = (y) => {
    const a = h('span', { class: 'foto sin-foto' }, ico(ICO.usuario));
    if (y.foto) {
      const im = h('img', { src: `auth/foto?v=${y.foto}`, alt: '' });
      im.onerror = () => { a.classList.add('sin-foto'); a.replaceChildren(ico(ICO.usuario)); };
      a.classList.remove('sin-foto'); a.replaceChildren(im);
    }
    return a;
  };
  const avatarEmpresa = (e) => {
    if (!e.logo) return h('span', { class: 'ava' }, ico(ICO.edificio));
    const a = h('span', { class: 'ava logo' }); const im = h('img', { src: `auth/logo/${encodeURIComponent(e.slug)}?v=${e.logo}`, alt: '' });
    im.onerror = () => { a.className = 'ava'; a.replaceChildren(ico(ICO.edificio)); };
    a.append(im); return a;
  };
  const iniciales = (t) => String(t || '?').trim().split(/\s+/).slice(0, 2).map((x) => x[0]).join('').toUpperCase();

  function vistaInicio() {
    clear(); document.body.classList.add('en-portal');
    const m = h('div', { class: 'msg', role: 'alert' });
    const n = state.yo.empresas.length;
    const hero = h('section', { class: 'pt-hero' }, h('div', { class: 'pt-wrap' }, h('p', { class: 'eyebrow' }, 'Mis empresas'),
      h('h1', {}, n ? 'Elige la empresa a la que deseas ingresar' : 'Aún no tienes empresas'),
      h('p', { class: 'sub' }, n ? (n === 1 ? 'Tienes acceso a 1 empresa.' : `Tienes acceso a ${n} empresas.`) : 'Tu usuario todavía no está asociado a una empresa activa.')));
    let cuerpo;
    if (!n) cuerpo = h('div', { class: 'pt-vacio' }, h('div', { class: 'ico' }, ico(ICO.edificio)), h('h2', {}, 'Sin empresas'), h('p', {}, 'Pida a su administrador que lo agregue a una empresa.'));
    else cuerpo = h('div', { class: 'pt-grid' }, state.yo.empresas.map((e) => h('button', { class: 'pt-emp', type: 'button', onclick: () => entrar(e.slug, m) },
      h('div', { class: 'top' }, avatarEmpresa(e), h('div', {}, h('b', {}, e.nombre), h('span', { class: 'rol' }, e.rol === 'admin' ? 'Administrador' : 'Usuario'))),
      h('span', { class: 'url' }, `${location.host}${e.url}`),
      h('span', { class: 'ir' }, 'Ingresar', ico(ICO.flecha)))));
    const pie = h('footer', { class: 'pt-footer' }, h('div', { class: 'pt-wrap' }, h('span', { class: 'lema' }, h('span', {}, 'Impulsando la metodología ', h('b', {}, 'VDC'), ' en la industria AEC')), h('span', { class: 'copy' }, `© ${new Date().getFullYear()} Lyracode · BEPcloud`)));
    app.append(cabecera(), hero, h('main', { class: 'pt-wrap', style: 'width:100%' }, cuerpo, m), pie);
  }

  const modal = (titulo, cuerpo, acciones) => {
    const d = h('dialog', {}, h('h2', {}, titulo), cuerpo, h('div', { style: 'display:flex;gap:8px;justify-content:flex-end;margin-top:16px' }, acciones, h('button', { type: 'button', onclick: () => { d.close(); d.remove(); } }, 'Cerrar')));
    document.body.append(d); d.showModal(); return d;
  };

  function dialogoClave() {
    const a = h('input', { type: 'password', autocomplete: 'current-password' }); const n = h('input', { type: 'password', autocomplete: 'new-password' }); const m = h('div', { class: 'msg' });
    const d = modal('Cambiar contraseña', h('div', {}, h('label', {}, 'Contraseña actual'), a, h('label', {}, 'Nueva contraseña (mínimo 8 caracteres)'), n, m),
      h('button', { class: 'primary', onclick: async () => { const r = await api('auth/cambiar-clave', 'POST', { actual: a.value, nueva: n.value }); if (r.ok) { msg(m, r.d.mensaje, true); setTimeout(() => { d.close(); d.remove(); }, 900); } else msg(m, r.d.mensaje); } }, 'Guardar'));
  }

  // ---------------- arranque ----------------
  async function iniciar() {
    const r = await api('auth/yo').catch(() => null);
    if (!r || !r.ok) return vistaLogin();
    state.yo = r.d;
    const pedida = qp.get('empresa');
    const sup = r.d.usuario.superadmin;
    if (pedida && r.d.empresas.some((e) => e.slug === pedida)) { if (await entrar(pedida)) return; }
    else if (!pedida && !qp.has('cambiar') && sup && r.d.empresas.some((e) => e.slug === 'principal')) { if (await entrar('principal')) return; }   // el superadmin siempre inicia en la principal; para ir a otra usa "Cambiar empresa"
    // quien no es superadmin no cambia de empresa: con una sola, entra directo (aunque pida elegir)
    else if (r.d.empresas.length === 1 && (!sup || (!pedida && !qp.has('cambiar')))) { if (await entrar(r.d.empresas[0].slug)) return; }
    vistaInicio();
  }
  iniciar();
})();
</script>
</body>
</html>
